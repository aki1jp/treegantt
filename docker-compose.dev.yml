# 開発用の追加構成（自動では読み込まれない。§2.2）
#   起動: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#   本番は docker compose up（docker-compose.yml のみ）
# command は npm ci が失敗したら npm run dev へ進まず停止する（失敗の握りつぶし防止）
services:
  frontend:
    image: treegantt-frontend:dev
    build:
      context: ./frontend
      target: dev
    command: sh -c "{ [ node_modules/.package-lock.json -nt package-lock.json ] || npm ci; } && npm run dev"
    volumes:
      - ./frontend:/app
      - fe_node_modules:/app/node_modules
    environment:
      - API_PROXY_TARGET=http://api:${PORT:-4000}
      - CHOKIDAR_USEPOLLING=true

  api:
    image: treegantt-api:dev
    build:
      context: ./api
      target: dev
    command: sh -c "{ [ node_modules/.package-lock.json -nt package-lock.json ] || npm ci; } && npm run dev"
    volumes:
      - ./api:/app
      - api_node_modules:/app/node_modules

  # 開発ツール（docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile dev-tools up db-ui）
  db-ui:
    image: coleifer/sqlite-web
    ports:
      - '8888:8080'
    volumes:
      - ./api/data:/data
    command: sqlite_web --host 0.0.0.0 /data/treegantt.db
    profiles:
      - dev-tools

volumes:
  api_node_modules:
  fe_node_modules:
